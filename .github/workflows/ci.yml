name: Server CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: server-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:bundle
      - name: Build container
        run: docker build -t syncclipboard-server:test .
        timeout-minutes: 10
      - name: Test container
        run: bun run test:docker
        env:
          SYNCCLIPBOARD_TEST_DOCKER_IMAGE: syncclipboard-server:test
        timeout-minutes: 5
      - uses: actions/upload-artifact@v7
        with:
          name: syncclipboard-server
          path: |
            dist/index.js
            appsettings.example.json
            LICENSE
            LICENSES/
