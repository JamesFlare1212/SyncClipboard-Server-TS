name: 服务端错误 | Server bug report
description: Report a SyncClipboard Server problem
labels: ["bug report"]
body:
  - type: textarea
    attributes:
      label: 错误描述与复现步骤 | Description and steps to reproduce
    validations:
      required: true
  - type: input
    attributes:
      label: 服务端和 Bun 版本 | Server and Bun versions
    validations:
      required: true
  - type: input
    attributes:
      label: 部署环境 | Deployment environment
      description: OS, architecture, Docker or native Bun
  - type: textarea
    attributes:
      label: 服务端日志 | Server logs
      description: Remove passwords and private clipboard contents before posting.
